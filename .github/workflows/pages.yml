name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gate di sicurezza: nessun deploy se i dati contengono markup attivo,
      # se manca l'escaping o se una rotta smette di renderizzare. Gira PRIMA
      # della composizione, cosi' un contenuto non validato non arriva mai
      # all'artefatto pubblicato.
      - name: Security and render tests
        run: |
          set -euo pipefail
          node --version
          node --test tools/security.test.cjs
          node --test tools/render.test.cjs
          python3 -m unittest discover -s tools -p 'test_*.py'

      # Il sito e' formato da index.html e assets/. Pubblicare la radice del
      # repository esporrebbe anche tools/, .github/ e i documenti interni:
      # quindi si compone una directory di pubblicazione esplicita.
      - name: Assemble the published directory
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/.well-known
          cp index.html _site/
          cp -R assets _site/
          cp robots.txt _site/
          cp .well-known/security.txt _site/.well-known/
          # Nessun Jekyll: i file e le directory che iniziano con _ devono
          # essere serviti cosi' come sono.
          touch _site/.nojekyll
          # Controllo negativo: nulla di escluso deve essere finito dentro.
          for escluso in tools .github vulnerabilita.md nuovo_sito.md manuale.md; do
            test ! -e "_site/$escluso"
          done

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
